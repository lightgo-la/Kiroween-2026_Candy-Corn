[package]
name = "candy-corn"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "Candy-Corn"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
eframe = "0.37.0"
encoding_rs = "0.8.44"
encoding_rs_io = "0.1.8"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
ureq = { version = "3", features = ["json"] }
tiktoken-rs = "0.12.1"

[build-dependencies]
winresource = "0.1.34"
